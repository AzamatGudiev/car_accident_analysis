        // Критические зоны
        const hotspots = [{"name": "Зона #6", "lat": 43.50536897142857, "lng": 44.58416545714287, "accidents": 35, "dead": 1, "injured": 55, "address": "г Малгобек, ул Осканова, 11"}, {"name": "Зона #34", "lat": 43.31256875, "lng": 45.051990625, "accidents": 32, "dead": 6, "injured": 69, "address": "пгт Сунжа, ул Калинина"}, {"name": "Зона #55", "lat": 43.225182875, "lng": 44.76362106249999, "accidents": 16, "dead": 3, "injured": 17, "address": "тер Центральный округ, ул Московская, 2"}, {"name": "Зона #42", "lat": 43.30652557142857, "lng": 44.91967314285714, "accidents": 14, "dead": 2, "injured": 23, "address": "мкр 1-й, ул Промысловая, 1"}, {"name": "Зона #45", "lat": 43.21268930769231, "lng": 44.79540407692308, "accidents": 13, "dead": 5, "injured": 20, "address": "г Назрань, Р-217 Кавказ автомобильная дорога М-4 Дон - Владикавказ - Грозный - М"}];
        
        // Функция определения цвета
        function getColor(severity) {
            if (severity === 'С погибшими') return '#DC143C';
            if (severity === 'Тяжёлый') return '#FF8C00';
            return '#FFD700';
        }
        
        // Создание кластеров маркеров
        const markers = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        });
        
        accidents.forEach(accident => {
            const color = getColor(accident.severity);
            const size = accident.dead > 0 ? 10 : 6;
            
            const marker = L.circleMarker([accident.lat, accident.lng], {
                radius: size,
                fillColor: color,
                color: '#000',
                weight: 1,
                opacity: 0.8,
                fillOpacity: 0.7
            });
            
            const popupContent = `
                <div style="font-family: Arial; min-width: 200px;">
                    <h3 style="margin: 0 0 10px 0; color: ${color};">${accident.category}</h3>
                    <p style="margin: 5px 0;"><strong>Дата:</strong> ${accident.date} ${accident.time}</p>
                    <p style="margin: 5px 0;"><strong>Тяжесть:</strong> ${accident.severity}</p>
                    <p style="margin: 5px 0;"><strong>Погибших:</strong> ${accident.dead}</p>
                    <p style="margin: 5px 0;"><strong>Раненых:</strong> ${accident.injured}</p>
                    <p style="margin: 5px 0;"><strong>Адрес:</strong> ${accident.address}</p>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            markers.addLayer(marker);
        });
        
        map.addLayer(markers);
        
        // Тепловая карта
        const heatData = accidents.map(a => [
            a.lat, 
            a.lng, 
            a.dead > 0 ? 1.0 : (a.injured > 0 ? 0.5 : 0.2)
        ]);
        
        const heat = L.heatLayer(heatData, {
            radius: 25,
            blur: 35,
            maxZoom: 17,
            max: 1.0,
            gradient: {
                0.0: 'blue',
                0.3: 'lime',
                0.5: 'yellow',
                0.7: 'orange',
                1.0: 'red'
            }
        });
        
        // Критические зоны
        const hotspotLayer = L.layerGroup();
        
        hotspots.forEach((zone, index) => {
            const circle = L.circle([zone.lat, zone.lng], {
                color: '#8B00FF',
                fillColor: '#8B00FF',
                fillOpacity: 0.2,
                weight: 3,
                radius: 300
            });
            
            const marker = L.marker([zone.lat, zone.lng], {
                icon: L.divIcon({
                    className: 'hotspot-label',
                    html: `<div style="
                        background: #8B00FF;
                        color: white;
                        padding: 8px 12px;
                        border-radius: 5px;
                        font-weight: bold;
                        font-size: 14px;
                        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
                        white-space: nowrap;
                    ">${zone.name}</div>`,
                    iconSize: [100, 40],
                    iconAnchor: [50, 20]
                })
            });
            
            const popupContent = `
                <div style="font-family: Arial; min-width: 250px;">
                    <h3 style="margin: 0 0 10px 0; color: #8B00FF;">${zone.name}</h3>
                    <p style="margin: 5px 0;"><strong>Адрес:</strong> ${zone.address}</p>
                    <p style="margin: 5px 0;"><strong>ДТП:</strong> ${zone.accidents}</p>
                    <p style="margin: 5px 0;"><strong>Погибших:</strong> ${zone.dead}</p>
                    <p style="margin: 5px 0;"><strong>Раненых:</strong> ${zone.injured}</p>
                    <p style="margin: 10px 0 0 0; padding: 10px; background: #FFF3CD; border-radius: 3px;">
                        <strong>⚠️ Требуется приоритетное внимание</strong>
                    </p>
                </div>
            `;
            
            circle.bindPopup(popupContent);
            marker.bindPopup(popupContent);
            
            hotspotLayer.addLayer(circle);
            hotspotLayer.addLayer(marker);
        });
        
        // Управление слоями
        let clustersVisible = true;
        let hotspotsVisible = false;
        let heatVisible = false;
        
        document.getElementById('toggleClusters').addEventListener('click', function() {
            if (clustersVisible) {
                map.removeLayer(markers);
                this.classList.remove('active');
            } else {
                map.addLayer(markers);
                this.classList.add('active');
            }
            clustersVisible = !clustersVisible;
        });
        
        document.getElementById('toggleHotspots').addEventListener('click', function() {
            if (hotspotsVisible) {
                map.removeLayer(hotspotLayer);
                map.removeLayer(heat);
                this.classList.remove('active');
                this.textContent = 'Показать критические зоны';
            } else {
                map.addLayer(hotspotLayer);
                map.addLayer(heat);
                this.classList.add('active');
                this.textContent = 'Скрыть критические зоны';
            }
            hotspotsVisible = !hotspotsVisible;
        });
        
        console.log('Карта загружена успешно. ДТП:', accidents.length, 'Критических зон:', hotspots.length);
    </script>
